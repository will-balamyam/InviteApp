<div class="container mt-4">
  <h3 class="text-center">{{ isEditMode ? 'Edit Family' : 'Add Family' }}</h3>
  <form [formGroup]="familyForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="familyName" class="form-label">Family Name</label>
      <input type="text" id="familyName" class="form-control" formControlName="familyName" required>
    </div>
    <!--<div class="mb-3">
      <label for="familyCode" class="form-label">Family Code</label>
      <input type="text" id="familyCode" class="form-control" formControlName="familyCode" required>
    </div>-->
    <div class="mb-3">
      <label for="contactEmail" class="form-label">Contact Email</label>
      <input type="email" id="contactEmail" class="form-control" formControlName="contactEmail">
    </div>
    <!--<div class="mb-3">
      <label for="contactPhone" class="form-label">Contact Phone</label>
      <input type="text" id="contactPhone" class="form-control" formControlName="contactPhone">
    </div>-->
    <ngx-intl-tel-input
      [cssClass]="'form-control w-100'"
      [preferredCountries]="[CountryISO.Mexico]"
      [enableAutoCountrySelect]="false"
      [enablePlaceholder]="true"
      [searchCountryFlag]="true"
      [searchCountryField]="[SearchCountryField.Iso2, SearchCountryField.Name]"
      [selectFirstCountry]="false"
      [selectedCountryISO]="CountryISO.Mexico"
      [maxLength]="15"
      [phoneValidation]="true"
      [separateDialCode]="false"
      name="contactPhone"
      formControlName="contactPhone"
    ></ngx-intl-tel-input>
    <div class="mb-3">
      <label for="invitation" class="form-label">Invitation ID</label>
      <select class="form-select" name="invitation" id="invitation" formControlName="invitation" required>
        @for (invitation of invitations; track invitation.id) {
          <option [value]="invitation.id" selected>
            {{ invitation.eventName }} (ID: {{ invitation.id }})
          </option>
        }
      </select>
    </div>

    <!-- Sección dinámica de Family Access -->
    <div class="mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="text-secondary">Family Members</h5>
        <button type="button" class="btn btn-sm btn-outline-primary" (click)="addFamilyAccess()">
          <i class="bi bi-plus-circle"></i> Add Member
        </button>
      </div>

      <div formArrayName="familyAccesses">
        <div class="card mb-3" *ngFor="let access of familyAccesses.controls; let i = index; trackBy: getTempId" [formGroupName]="i">
          <div class="card-body">
            <div class="row">
              <div class="col-md-4">
                <label class="form-label">Member Name</label>
                <input type="text" class="form-control" formControlName="memberName" placeholder="Enter member name" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Confirmation Status</label>
                <select class="form-select" formControlName="confirmed">
                  <option [value]="null">Not Confirmed</option>
                  <option [value]="true">Confirmed</option>
                  <option [value]="false">Declined</option>
                </select>
              </div>
              <div class="col-md-4 d-flex align-items-end">
                <button type="button" class="btn btn-sm btn-outline-danger w-100" (click)="removeFamilyAccess(i)">
                  <i class="bi bi-trash"></i> Remove
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="text-center text-muted py-3" *ngIf="familyAccesses.length === 0">
          <p>No family members added yet. Click "Add Member" to get started.</p>
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100">{{ isEditMode ? 'Update Family' : 'Create Family' }}</button>
  </form>
</div>
