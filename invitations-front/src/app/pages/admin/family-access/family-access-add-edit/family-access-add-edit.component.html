<div class="container mt-4">
  <h3 class="text-center">{{ isEditMode ? 'Edit Family Access' : 'Add Family Access' }}</h3>
  <form [formGroup]="familyAccessForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="family" class="form-label">Family ID</label>
      <select formControlName="family" name="family" id="family" class="form-select">
        @for (family of families; track family.id) {
          <option [value]="family.id">
            {{ family.familyName }} (ID: {{ family.id }})
          </option>
        }
      </select>
    </div>
    <div class="mb-3">
      <label for="memberName" class="form-label">Member Name</label>
      <input type="text" id="memberName" class="form-control" formControlName="memberName" required>
    </div>
    <div class="mb-3">
      <label for="confirmed" class="form-label">Confirmed</label>
      <select id="confirmed" class="form-control" formControlName="confirmed">
        <option [value]="true">Yes</option>
        <option [value]="false">No</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary w-100">{{ isEditMode ? 'Update' : 'Create' }}</button>
  </form>
</div>
